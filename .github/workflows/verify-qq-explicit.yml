name: Verify explicit QQ action
on:
  pull_request:
    paths: ['brand/qq*', '.github/workflows/verify-qq-explicit.yml']
  push:
    branches: [main]
    paths: ['brand/qq*', '.github/workflows/verify-qq-explicit.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --test brand/qq-explicit.test.mjs
